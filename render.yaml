# Blueprint de Render — crea el servicio del bot con 1 clic desde el dashboard.
# Dashboard → Blueprints → New Blueprint Instance → apuntar a este repo.
services:
  - type: web
    name: pichangueros-bot
    runtime: docker
    plan: starter            # ~$7/mes, always-on (necesario para mantener la sesión)
    region: oregon
    dockerfilePath: ./Dockerfile
    # CHEQUEO DE SALUD. Antes NO estaba, y el motivo escrito acá era el arranque
    # de Chromium: con Baileys el navegador tardaba en levantar y un chequeo HTTP
    # temprano podía disparar reinicios en loop. Ese motivo ya no existe — el
    # transporte es Cloud API y no hay Chromium ni puppeteer en el contenedor.
    #
    # Con esto, un deploy que compile bien pero reviente al arrancar (un require
    # mal, una migración que falla) queda como deploy FALLIDO y Render sigue
    # sirviendo la instancia anterior. Sin esto, mataba la que funcionaba y el
    # panel y el webhook se caían: los Yapes que llegaran en ese rato se perdían.
    #
    # `/` sirve porque contesta apenas levanta el servidor y no depende de la
    # conexión de WhatsApp: informa el estado, pero responde 200 igual.
    healthCheckPath: /
    autoDeploy: true
    disk:
      name: wwebjs-auth      # guarda la sesión de WhatsApp → se escanea el QR UNA sola vez
      mountPath: /app/.wwebjs_auth
      sizeGB: 1
    envVars:
      - key: SAFE_MODE
        value: "true"        # MODO SEGURO: el cerebro solo atiende a ALLOWED_TESTERS
      - key: TEST_TRIGGER
        value: "ping kipi"
      - key: OPENAI_MODEL
        value: "gpt-4o-mini" # modelo económico (decisión del proyecto)
      - key: OPENAI_API_KEY
        sync: false          # setear en el dashboard (sin key el cerebro queda apagado)
      - key: ALLOWED_TESTERS
        sync: false          # ej. "51999888777,51988877766" (solo dígitos, con 51)
      - key: NOTIFY_NUMBER
        sync: false          # recibe avisos de leads/handoffs y usa comandos "kipi ..."
